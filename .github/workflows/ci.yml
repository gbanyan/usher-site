name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Snapshot mode builds without a live CMS: committed content-snapshots are
  # the content source, so CI needs no CMS access and no secrets.
  CONTENT_SOURCE: snapshot
  SITE_URL: https://www.usher.org.tw

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore image variant cache
        uses: actions/cache@v4
        with:
          # Responsive WebP variants written by src/lib/images.ts (keyed by
          # source content hash, so stale entries are never served).
          path: node_modules/.cache/usher-images
          key: usher-images-${{ hashFiles('src/lib/images.ts') }}-${{ github.run_id }}
          restore-keys: usher-images-${{ hashFiles('src/lib/images.ts') }}-

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Snapshot Markdown checks
        run: npm run check:content

      - name: Content asset integrity
        run: npm run check:assets

      - name: Static build (snapshot mode)
        run: npm run build

      - name: Static accessibility checks
        run: npm run check:a11y
