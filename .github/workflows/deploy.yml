name: Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [cms-content-changed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CONTENT_SOURCE: api
      CMS_API_URL: https://member.usher.org.tw/api/v1
      SITE_URL: https://www.usher.org.tw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test

      - name: Build from live CMS
        run: npm run build
        env:
          SITE_BUILD_TOKEN: ${{ secrets.SITE_BUILD_TOKEN }}

      - name: Static accessibility checks
        run: npm run check:a11y

      - name: Deploy to Cloudflare
        shell: bash # explicit bash enables pipefail so a wrangler failure is not masked by tee
        run: npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/wrangler-deploy.log"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summarize deployment
        if: success()
        run: |
          {
            echo "### Deployed to Cloudflare Workers"
            grep -E "Current Version ID|https://[^ ]+\.workers\.dev" "$RUNNER_TEMP/wrangler-deploy.log" | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
